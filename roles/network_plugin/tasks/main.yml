---
# tasks file for network-plugin
- name: Install the selected pod network plugin
  ansible.builtin.include_tasks: "{{ network_plugin }}.yml"
  when: network_plugin in ['flannel', 'cilium']

- name: Fail on an unsupported network plugin
  ansible.builtin.fail:
    msg: "Unsupported network_plugin '{{ network_plugin }}' (supported: flannel, cilium)"
  when: network_plugin not in ['flannel', 'cilium']
