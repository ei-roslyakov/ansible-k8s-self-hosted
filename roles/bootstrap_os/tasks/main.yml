---
# Disable swap
- name: Disable swap
  become: true
  ansible.builtin.shell: |
    swapoff -a
    sed -i '/swap/d' /etc/fstab
  when: ansible_facts['swaptotal_mb'] > 0
  changed_when: false

# Install pip3 and python3-venv packages on master and worker nodes
- name: Install pip3
  become: true
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv
    state: present
    update_cache: true
  when: inventory_hostname in groups['kube_nodes'] or inventory_hostname in groups['kube_master']

# Create a Python virtual environment for Kubernetes client tools
- name: Create virtual environment for Kubernetes client
  become: true
  ansible.builtin.shell: |
    python3 -m venv /opt/k8s-venv
  args:
    creates: /opt/k8s-venv

# Install the Kubernetes Python client inside the virtual environment
- name: Install Kubernetes Python client
  become: true
  ansible.builtin.shell: |
    /opt/k8s-venv/bin/pip install kubernetes
  args:
    creates: /opt/k8s-venv/bin/kubectl
  environment:
    PIP_BREAK_SYSTEM_PACKAGES: "1"

# Set the system hostname to match the inventory name on master and worker nodes
- name: Set hostname
  become: true
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# Add control plane and node hostnames/IPs to /etc/hosts for name resolution
- name: Add control plane and node names to /etc/hosts
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item }}"
    state: present
  loop:
    - "{{ hostvars[inventory_hostname].ansible_host | default(ansible_facts['default_ipv4']['address']) }} {{ inventory_hostname }}"
    - "{{ hostvars[groups['kube_master'][0]].ansible_host | default(hostvars[groups['kube_master'][0]]['ansible_facts']['default_ipv4']['address']) }} k8s-cluster"

# Load the br_netfilter kernel module for Kubernetes networking
- name: Load br_netfilter module
  become: true
  community.general.modprobe:
    name: br_netfilter
    state: present

# Ensure br_netfilter module is loaded on boot by adding it to /etc/modules-load.d/k8s.conf
- name: Persist br_netfilter module loading on boot
  become: true
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/k8s.conf
    line: br_netfilter
    create: true
    mode: '0644'

# Set sysctl parameter to enable iptables for bridged IPv4 traffic
- name: Ensure net.bridge.bridge-nf-call-iptables is set to 1
  become: true
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-iptables
    value: '1'
    state: present
    reload: true

# Set sysctl parameter to enable iptables for bridged IPv6 traffic
- name: Ensure net.bridge.bridge-nf-call-ip6tables is set to 1
  become: true
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-ip6tables
    value: '1'
    state: present
    reload: true

# Enable IPv4 forwarding for Kubernetes networking
- name: Ensure net.ipv4.ip_forward is set to 1
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: true

# Disable swap accounting warnings by setting vm.swappiness to 0
- name: Disable swap accounting warnings
  become: true
  ansible.posix.sysctl:
    name: vm.swappiness
    value: '0'
    state: present
    reload: true

########################################################

# tasks file for bootstrap-cluster
- name: Install dependencies
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - nfs-common
    state: present

# Download and add Docker's official GPG key to the system keyring
- name: Add Docker GPG key to keyring
  become: true
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    keyring: /usr/share/keyrings/docker-archive-keyring.gpg
    state: present

# Add Docker's official APT repository for Ubuntu
- name: Add Docker repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]
      https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present

# Install containerd runtime and required CNI plugins
- name: Install containerd and Kubernetes CNI plugins
  become: true
  ansible.builtin.apt:
    update_cache: true
    name:
      - containerd.io
    state: present

- name: Configure containerd
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    mkdir -p /etc/containerd
    containerd config default | tee /etc/containerd/config.toml
    sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
    sed -i 's#sandbox_image = ".*"#sandbox_image = "registry.k8s.io/pause:3.10"#' /etc/containerd/config.toml
  args:
    executable: /bin/bash
  changed_when: false

# Restart containerd service and enable it to start on boot
- name: Restart containerd
  become: true
  ansible.builtin.service:
    name: containerd
    state: restarted
    enabled: true

# Ensure keyrings directory exists
- name: Ensure keyrings directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

# Add Kubernetes GPG key to keyring
- name: Add Kubernetes GPG key to keyring
  become: true
  ansible.builtin.apt_key:
    url: >-
      https://pkgs.k8s.io/core:/stable:/v{{ kube_version.split('.')[:2] | join('.') }}/deb/Release.key
    keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: present

# Remove old Kubernetes list
- name: Remove old Kubernetes list
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/kubernetes.list
    state: absent

# Add Kubernetes apt repository
- name: Add Kubernetes apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/v{{ kube_version.split('.')[:2] | join('.') }}/deb/ /
    filename: kubernetes
    state: present

- name: Install kubelet and kubectl
  become: true
  ansible.builtin.apt:
    name:
      - "kubeadm={{ kube_version }}*"
      - "kubelet={{ kube_version }}*"
      - "kubectl={{ kube_version }}*"
    state: present
    force: true

# Hold kubelet and kubectl packages to prevent unintended upgrades on control plane nodes
- name: Hold kubelet and kubectl on control plane
  become: true
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubeadm
    - kubelet
    - kubectl
